name: PR 862 required native coverage
on:
  push:
    branches: [codex/pr-checks-862-20261014]
permissions:
  contents: read
  actions: read
jobs:
  tests:
    name: PR native tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nextest-archive
          run-id: 38527409862
          github-token: ${{ github.token }}
      - name: Run the normal PR selection using the exact-source compiled archive
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cargo nextest run --archive-file tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite \
            --profile ci --partition "slice:$SHARD/4"
      - name: Kernel robustness golden sample (same as required PR coverage)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cargo nextest run --archive-file tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite \
            --profile ci --ignore-default-filter \
            -E "package(solidcraft-engine) & test(=tests::robustness_goldens::sample_$((SHARD - 1)))"
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr-junit-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
