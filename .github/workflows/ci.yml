name: PR 862 baseline diagnostic
on:
  push:
    branches: [codex/verify-pr-862-20261014]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  baseline-seed-91:
    name: Upstream baseline seed 91
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c51f9d4335e5e082ca585872f46f6aa2027ee58
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-tests
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Compare the unmodified upstream production code with its recorded seed 91
        run: |
          cat >> crates/engine/src/tests/robustness_goldens.rs <<'RS'

          #[test]
          fn diagnostic_baseline_seed_91() {
              let got = fuzz::golden(91, MAX_STEPS);
              let want = load()["seeds"]["91"].clone();
              println!("BASELINE_GOLDEN_91={got}");
              println!("BASELINE_DIFF_91={:?}", differs(&want, &got));
              assert_eq!(got["outcome"], "ok");
          }
          RS
          cargo test -p solidcraft-engine --lib --profile ci --locked diagnostic_baseline_seed_91 -- --nocapture
