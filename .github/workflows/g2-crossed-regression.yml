name: G2 crossed cap regression
on:
  push:
    branches: [codex/crossed-pr-862-20261014]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
jobs:
  crossed-caps:
    name: Reject crossed G2 caps and preserve supported fillets
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-tests
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Kernel Clippy
        run: cargo clippy -p solidcraft-kernel --all-targets --profile ci --locked -- -D warnings
      - name: G2 regressions
        run: cargo test -p solidcraft-kernel --profile ci --locked g2_fillet_ -- --nocapture
      - name: Confirm the new regression catches the original bug
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          p=pathlib.Path("crates/kernel/src/blend.rs")
          fixed=p.read_text()
          old='    closed(cur)\n}\n\n/// Most edges whose other orders'
          assert fixed.count(old)==1
          p.write_text(fixed.replace(old,'    Ok(cur)\n}\n\n/// Most edges whose other orders',1))
          try:
              r=subprocess.run(["cargo","test","-p","solidcraft-kernel","--profile","ci","--locked","g2_fillet_refuses_sections_crossing_a_cap_hole","--","--nocapture"],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              print(r.stdout)
              assert r.returncode!=0, "the regression did not catch the original missing guard"
              assert "accepted G2 result: validity=[], crossed_faces=2" in r.stdout, "failure was not the original invalid cap geometry"
              assert "test result: FAILED" in r.stdout
              print("Confirmed: original G2 accepts two crossed caps despite valid topology; the fixed path refuses them.")
          finally:
              p.write_text(fixed)
          PY
