name: G2 crossed cap before and after
on:
  push:
    branches: [codex/cap-evidence-pr-862-20261014]
permissions:
  contents: read
jobs:
  screenshot:
    name: Actual crossed-cap behavior before and after
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-tests
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Install headless display and software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libxkbcommon-x11-0 libgl1-mesa-dri mesa-vulkan-drivers
      - name: Prepare the evidence script
        run: |
          cat > "$RUNNER_TEMP/capture-g2-cap.py" <<'PY'
          import base64,json,os,pathlib,secrets,socket,subprocess,time
          port=43129
          token=secrets.token_hex(32)
          env=dict(os.environ,SOLIDCRAFT_CONTROL_TOKEN=token,LIBGL_ALWAYS_SOFTWARE="1",WINIT_UNIX_BACKEND="x11",WGPU_BACKEND="vulkan")
          expect_rejected=os.environ.get("G2_EXPECT_REJECTED")=="1"
          variant="after" if expect_rejected else "before"
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/("g2-crossed-cap-"+variant+".png")
          log=pathlib.Path(os.environ["RUNNER_TEMP"])/("g2-crossed-cap-"+variant+".log")
          def call(method,params):
              with socket.create_connection(("127.0.0.1",port),timeout=10) as sock:
                  sock.settimeout(120)
                  sock.sendall((json.dumps({"id":1,"method":method,"params":params,"token":token})+"\n").encode())
                  result=json.loads(sock.makefile("rb").readline())
                  if not result.get("ok"):
                      raise RuntimeError(result.get("error",str(result)))
                  return result.get("result")
          with log.open("w") as output:
              app=subprocess.Popen(["target/ci/solidcraft","--control",str(port)],env=env,stdout=output,stderr=subprocess.STDOUT)
              try:
                  deadline=time.monotonic()+90
                  while True:
                      try:
                          call("ui.inspect",{})
                          break
                      except (OSError,ValueError):
                          if app.poll() is not None or time.monotonic()>deadline:
                              raise RuntimeError("The app did not start; see the app log artifact")
                          time.sleep(.2)
                  call("ui.home",{"open":False})
                  call("engine.execute",{"command":"file.new","params":{}})
                  call("ui.home",{"open":False})
                  call("engine.execute",{"command":"solid.box","params":{"length":20,"width":20,"height":20}})
                  call("engine.execute",{"command":"solid.cylinder","params":{"base":[2.5,2.5,-1],"radius":.75,"height":22,"operation":"cut"}})
                  call("ui.view",{"view":"top","animate":False})
                  call("ui.view",{"view":"fit","animate":False})
                  try:
                      reply=call("engine.execute",{"command":"solid.fillet","params":{"edges":[[0,0,10]],"radius":10,"type":"curvature","name":"G2"}})
                      assert not expect_rejected, "crossed G2 caps were accepted after the fix"
                      print("G2_CROSSED_RESULT=accepted "+json.dumps(reply))
                  except RuntimeError as error:
                      assert expect_rejected,str(error)
                      assert "rounds would leave openings" in str(error),str(error)
                      print("G2_CROSSED_RESULT=refused "+str(error))
                  state=call("ui.inspect",{})
                  print("G2_CROSSED_UI_STATUS="+json.dumps(state.get("status")))
                  time.sleep(1)
                  shot=call("ui.screenshot",{"path":str(out)})
                  assert out.is_file() and out.stat().st_size>1000,shot
                  print("G2_CROSSED_"+variant.upper()+"_PNG_BASE64="+base64.b64encode(out.read_bytes()).decode())
                  print("G2_CROSSED_"+variant.upper()+"_META="+json.dumps(shot))
              finally:
                  app.terminate()
                  try:app.wait(timeout=5)
                  except subprocess.TimeoutExpired:app.kill()
                  output.flush()
                  print("G2_APP_LOG="+log.read_text(errors="replace").replace(token,"[redacted]"))
          
          PY
      - name: Build the previous unguarded behavior
        run: |
          cp crates/kernel/src/blend.rs "$RUNNER_TEMP/blend-fixed.rs"
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path("crates/kernel/src/blend.rs")
          s=p.read_text()
          old='    closed(cur)\n}\n\n/// Most edges whose other orders'
          assert s.count(old)==1
          p.write_text(s.replace(old,'    Ok(cur)\n}\n\n/// Most edges whose other orders',1))
          PY
          cargo build -p solidcraft --profile ci --locked
      - name: Capture the original invalid result
        env:
          G2_EXPECT_REJECTED: "0"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python3 "$RUNNER_TEMP/capture-g2-cap.py"
      - name: Build the fixed behavior
        if: always()
        run: |
          cp "$RUNNER_TEMP/blend-fixed.rs" crates/kernel/src/blend.rs
          cargo build -p solidcraft --profile ci --locked
      - name: Capture the corrected refusal
        env:
          G2_EXPECT_REJECTED: "1"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python3 "$RUNNER_TEMP/capture-g2-cap.py"
      - name: Upload actual screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: g2-crossed-cap-before-and-after
          path: |
            ${{ runner.temp }}/g2-crossed-cap-*.png
            ${{ runner.temp }}/g2-crossed-cap-*.log
