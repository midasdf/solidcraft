name: PR 862 remaining diagnostics
on:
  push:
    branches: [codex/diagnose-pr-862-20261014]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  seed-33:
    name: Seed 33 (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: upstream-9c51f9d
            ref: 9c51f9d4335e5e082ca585872f46f6aa2027ee58
          - label: pr-b13412b
            ref: b13412b2d9acf415fe97c21d012f0208e9aede46
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-tests
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Print the result without changing production code or expected values
        run: |
          cat >> crates/engine/src/tests/robustness_goldens.rs <<'RS'

          #[test]
          fn diagnostic_seed_33() {
              let got = fuzz::golden(33, MAX_STEPS);
              let want = load()["seeds"]["33"].clone();
              println!("DIAGNOSTIC_GOLDEN_33={got}");
              println!("DIAGNOSTIC_DIFF_33={:?}", differs(&want, &got));
              assert_eq!(got["outcome"], "ok");
          }
          RS
          cargo test -p solidcraft-engine --lib --profile ci --locked diagnostic_seed_33 -- --nocapture
  offline-upstream:
    name: Upstream web offline test (three runs)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c51f9d4335e5e082ca585872f46f6aa2027ee58
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: repository-checks
      - name: First offline test
        id: offline1
        continue-on-error: true
        run: cargo xtask web-offline-test
      - name: Second offline test
        id: offline2
        continue-on-error: true
        run: cargo xtask web-offline-test
      - name: Third offline test
        id: offline3
        continue-on-error: true
        run: cargo xtask web-offline-test
      - name: Require all three offline tests to pass
        if: always()
        env:
          FIRST: ${{ steps.offline1.outcome }}
          SECOND: ${{ steps.offline2.outcome }}
          THIRD: ${{ steps.offline3.outcome }}
        run: test "$FIRST" = success && test "$SECOND" = success && test "$THIRD" = success
