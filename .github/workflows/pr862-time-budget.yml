name: PR 862 time-budget retry
on:
  push:
    branches: [codex/timing-pr-862-20261014]
permissions:
  contents: read
  actions: read
jobs:
  tests:
    name: Previously failed tests in isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nextest-archive
          run-id: 38527409862
          github-token: ${{ github.token }}
      - name: Retry the two time-budget failures with one test at a time
        run: |
          cargo nextest run --archive-file tests.tar.zst --workspace-remap . --extract-to . --extract-overwrite \
            --profile ci --test-threads 1 \
            -E '(package(solidcraft-engine) & test(=boolean_regression_tests::press_pull_on_the_enclosure_lid_is_prompt)) | (package(solidcraft-cli) & test(=action_matrix_sample))'
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: time-budget-retry-junit
          path: target/nextest/ci/junit.xml
